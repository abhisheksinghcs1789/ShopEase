<div class="success">
  <div class="success__mark">✓</div>
  <h1>Order placed</h1>
  <p>Thanks for shopping with ShopEase — your order is confirmed.</p>

  @if (order) {
    <div class="success__card tag-card">
      <div class="summary-line">
        <span>Order ID</span>
        <span class="price">{{ order._id }}</span>
      </div>
      <div class="summary-line">
        <span>Total paid</span>
        <span class="price">₹{{ order.totalAmount }}</span>
      </div>
      <div class="summary-line">
        <span>Payment method</span>
        <span>{{ order.paymentMethod === 'razorpay' ? 'Online (Razorpay)' : 'Cash on delivery' }}</span>
      </div>
    </div>
  }

  <div class="success__actions">
    <a routerLink="/orders" class="btn-primary">Track my orders</a>
    <a routerLink="/" class="btn-outline">Continue shopping</a>
  </div>
</div>
