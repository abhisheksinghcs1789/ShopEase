<div class="auth-page">
  <div class="auth-card tag-card">
    <span class="eyebrow">New around here?</span>
    <h1>Create an account</h1>

    <div class="field">
      <label>Full name</label>
      <input type="text" [(ngModel)]="name" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" (keyup.enter)="submit()" />
    </div>

    @if (error) {
      <p class="form-error">{{ error }}</p>
    }

    <button class="btn-primary auth-submit" [disabled]="loading" (click)="submit()">
      {{ loading ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
